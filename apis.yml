aid: fatora
name: Fatora
description: >-
  Fatora is a Qatar-based online invoicing and payment platform operated by MaktApp,
  serving more than 120,000 merchants across Arabic-speaking markets in the Gulf and
  wider MENA region. It combines professional invoicing, a hosted online store, POS/cashier
  tooling, WhatsApp/SMS/email payment links, and a card payment gateway (routing through
  processors such as Stripe, TAP and TESS) behind a single merchant account. Fatora publishes
  a REST API at api.fatora.io/v1 for programmatic checkout, tokenization, refunds and payment
  verification, plus full CRUD over invoices, clients and products, and AI helpers for product
  content. First-party SDKs are provided for PHP, Laravel, .NET, JavaScript, React, iOS, Android
  and Ionic, alongside ready-made plugins for WooCommerce, Magento, OpenCart, PrestaShop, Shopify
  and Wix. This profile was enriched from Fatora's public developer surface.
